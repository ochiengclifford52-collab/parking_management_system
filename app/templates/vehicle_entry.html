{% extends "base.html" %}

{% block title %}Register Vehicle{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <strong>Register Arriving Vehicle</strong>
      </div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Number Plate</label>
            <input name="number_plate" class="form-control form-control-lg text-uppercase"
                   placeholder="KDA 123A" required autofocus>
            <div class="form-text">Format: KXX 123X (spaces optional).</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Vehicle Type</label>
            <select name="vehicle_type" class="form-select">
              <option value="car">Car</option>
              <option value="suv">SUV</option>
              <option value="van">Van</option>
              <option value="motorcycle">Motorcycle</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success btn-lg w-100">
            <i class="bi bi-check-circle"></i> Register &amp; Allocate Bay
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
